{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "novadent-frontend.fullname" . }}
  labels:
    {{- include "novadent-frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "novadent-frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- toYaml (required "networkPolicy.ingress is required when networkPolicy.enabled" .Values.networkPolicy.ingress) | nindent 4 }}
  egress:
    {{- toYaml (required "networkPolicy.egress is required when networkPolicy.enabled" .Values.networkPolicy.egress) | nindent 4 }}
{{- end }}
