name: Publish image

# Builds and pushes the SPA image to GHCR on every push to main. The deploy repo
# (ai-deploy) pins the resulting `sha-<short>` tag in envs/dev/values/novadent-frontend.yaml.
# workflow_dispatch lets a feature branch exercise the pipeline before it is merged.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/publish-image.yml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

concurrency:
  # One run per ref; a newer push supersedes an in-flight build.
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same suite feature branches run, reused rather than copied.
  test:
    uses: ./.github/workflows/tests.yml

  publish:
    # No image ships on a red suite.
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required to push to ghcr.io using the automatic GITHUB_TOKEN.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Print the tag to pin in ai-deploy
        run: |
          echo "Pin this in ai-deploy/envs/dev/values/novadent-frontend.yaml:"
          echo "  image.tag: sha-${GITHUB_SHA::7}"
