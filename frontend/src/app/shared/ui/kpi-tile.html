<div
  class="flex items-start justify-between gap-3 rounded-xl border border-surface-700 bg-surface-900 px-4 py-3"
>
  <div class="min-w-0">
    <p class="text-meta uppercase tracking-[0.6px] text-surface-400">{{ label() }}</p>
    <p class="num mt-1 truncate text-[22px] font-semibold leading-tight text-surface-100">
      {{ value() }}
    </p>
    @if (hint()) {
      <p class="mt-1 text-caption text-surface-400">{{ hint() }}</p>
    }
  </div>
  @if (icon()) {
    <span
      class="flex h-9 w-9 flex-none items-center justify-center rounded-lg bg-primary/12 text-primary"
    >
      <i class="pi" [class]="'pi pi-' + icon()"></i>
    </span>
  }
</div>
