<section class="rounded-xl border border-surface-700 bg-surface-900 p-4">
  <h2 class="mb-2 text-meta uppercase tracking-[0.6px] text-surface-400">
    {{ 'settings.demo' | transloco }}
  </h2>
  <p class="text-caption text-surface-300">{{ 'settings.demoInfo' | transloco }}</p>
  @if (info(); as i) {
    <p class="mt-1 text-caption text-surface-400">
      {{ 'settings.seededAt' | transloco: { date: i.seededAt | appDate: 'dateTime' } }}
    </p>
  }
  @if (canManage()) {
    <div class="mt-3">
      <p-button
        [label]="'settings.resetDemo' | transloco"
        icon="pi pi-refresh"
        severity="danger"
        [outlined]="true"
        size="small"
        [loading]="resetting()"
        (onClick)="askReset()"
      />
    </div>
  }
</section>

<section class="rounded-xl border border-surface-700 bg-surface-900 p-4">
  <h2 class="mb-3 text-meta uppercase tracking-[0.6px] text-surface-400">
    {{ 'settings.gallery' | transloco }}
  </h2>
  <div class="flex flex-col gap-4">
    <div class="flex flex-wrap items-center gap-2">
      <p-button label="Primary" />
      <p-button label="Outlined" [outlined]="true" />
      <p-button label="Secondary" severity="secondary" [outlined]="true" />
      <p-button label="Text" [text]="true" />
      <p-button label="Danger" severity="danger" [outlined]="true" />
      <p-button icon="pi pi-check" [rounded]="true" pTooltip="Tooltip" />
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <p-tag value="Tag" />
      <p-tag value="Secondary" severity="secondary" />
      <p-tag value="Success" severity="success" />
      <p-tag value="Warn" severity="warn" />
      <p-tag value="Danger" severity="danger" />
      <app-status-tag tone="primary">Status primary</app-status-tag>
      <app-status-tag tone="info">Info</app-status-tag>
      <app-status-tag tone="warn">Warn</app-status-tag>
      <app-status-tag tone="danger">Danger</app-status-tag>
    </div>
    <div class="grid gap-3 sm:grid-cols-3">
      <input pInputText placeholder="Input" class="w-full" />
      <p-select
        [options]="galleryOptions"
        [ngModel]="galleryChoice()"
        (ngModelChange)="galleryChoice.set($event)"
        appendTo="body"
        styleClass="w-full"
      />
      <p-datepicker
        [ngModel]="galleryDate()"
        (ngModelChange)="galleryDate.set($event)"
        [showIcon]="true"
        appendTo="body"
        styleClass="w-full"
      />
    </div>
    <div class="flex flex-wrap items-center gap-4">
      <p-selectbutton
        [options]="galleryOptions"
        [ngModel]="galleryChoice()"
        (ngModelChange)="galleryChoice.set($event)"
        [allowEmpty]="false"
      />
      <p-toggleswitch [ngModel]="galleryToggle()" (ngModelChange)="galleryToggle.set($event)" />
      <label class="flex items-center gap-2 text-caption"
        ><p-checkbox
          [binary]="true"
          [ngModel]="galleryCheck()"
          (ngModelChange)="galleryCheck.set($event)"
        />
        Checkbox</label
      >
    </div>
    <div class="flex flex-col gap-2">
      <p-message severity="info" text="Info message" size="small" />
      <p-message severity="warn" text="Warning message" size="small" />
      <p-message severity="error" text="Error message" size="small" />
      <p-message severity="secondary" text="Secondary message" size="small" />
    </div>
    <p-skeleton height="2rem" />
  </div>
</section>
