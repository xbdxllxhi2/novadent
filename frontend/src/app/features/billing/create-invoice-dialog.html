<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [draggable]="false"
  [dismissableMask]="true"
  [header]="'billing.newInvoice' | transloco"
  [style]="{ width: 'min(96vw, 640px)' }"
>
  <p class="mb-3 text-caption text-surface-300">{{ 'billing.selectItems' | transloco }}</p>
  @if (store.uninvoiced().length === 0) {
    <p
      class="rounded-lg border border-dashed border-surface-700 px-4 py-6 text-center text-caption text-surface-400"
    >
      {{ 'billing.noUninvoiced' | transloco }}
    </p>
  } @else {
    <ul class="divide-y divide-surface-700 rounded-lg border border-surface-700">
      @for (item of store.uninvoiced(); track item.itemId) {
        <li class="flex items-center gap-3 px-3 py-2">
          <p-checkbox
            [binary]="true"
            [ngModel]="selected().has(item.itemId)"
            (ngModelChange)="toggle(item.itemId, $event)"
            [inputId]="'inv-' + item.itemId"
          />
          <label [for]="'inv-' + item.itemId" class="min-w-0 flex-1 cursor-pointer">
            <span class="block truncate text-caption text-surface-100">
              @if (item.toothFdi) {
                <span class="num text-surface-400">{{ item.toothFdi }}</span>
              }
              {{ procedures.get(item.procedureCode)?.name | localized }}
            </span>
            <span class="block truncate text-meta text-surface-400"
              >{{ item.planTitle }} <span class="mx-1">·</span>
              {{ staff.doctor(item.doctorId)?.nameLatin }} <span class="mx-1">·</span>
              {{
                'billing.completedOn' | transloco: { date: item.completedAt | appDate: 'short' }
              }}</span
            >
          </label>
          <span class="num text-caption text-surface-100">{{ item.price | money }}</span>
        </li>
      }
    </ul>
    <p class="mt-3 text-end text-caption text-surface-300">
      {{ 'billing.total' | transloco }}
      <span class="num text-ui-lg font-semibold text-surface-100">{{ total() | money }}</span>
    </p>
  }
  <ng-template #footer>
    <p-button
      [label]="'common.cancel' | transloco"
      severity="secondary"
      [outlined]="true"
      (onClick)="visible.set(false)"
    />
    <p-button
      [label]="'common.create' | transloco"
      icon="pi pi-check"
      [disabled]="selected().size === 0"
      [loading]="store.saving()"
      (onClick)="submit()"
    />
  </ng-template>
</p-dialog>
