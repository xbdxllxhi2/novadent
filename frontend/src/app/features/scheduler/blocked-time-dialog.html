<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [draggable]="false"
  [dismissableMask]="true"
  [header]="'scheduler.blockTime' | transloco"
  [style]="{ width: 'min(96vw, 520px)' }"
>
  <div class="flex flex-col gap-4">
    <label class="flex flex-col gap-1 text-caption text-surface-300">
      {{ 'scheduler.reason' | transloco }}
      <input
        pInputText
        [ngModel]="reason()"
        (ngModelChange)="reason.set($event)"
        class="w-full"
        [invalid]="submitted() && !reason().trim()"
        autocomplete="off"
      />
    </label>
    <div class="grid gap-3 sm:grid-cols-3">
      <label class="flex flex-col gap-1 text-caption text-surface-300">
        {{ 'common.date' | transloco }}
        <p-datepicker
          [ngModel]="date()"
          (ngModelChange)="date.set($event)"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
          appendTo="body"
          styleClass="w-full"
        />
      </label>
      <label class="flex flex-col gap-1 text-caption text-surface-300">
        {{ 'hours.start' | transloco }}
        <p-select
          [ngModel]="startHm()"
          (ngModelChange)="startHm.set($event)"
          [options]="timeOptions"
          appendTo="body"
          styleClass="w-full num"
        />
      </label>
      <label class="flex flex-col gap-1 text-caption text-surface-300">
        {{ 'hours.end' | transloco }}
        <p-select
          [ngModel]="endHm()"
          (ngModelChange)="endHm.set($event)"
          [options]="timeOptions"
          appendTo="body"
          styleClass="w-full num"
          [invalid]="submitted() && endHm() <= startHm()"
        />
      </label>
    </div>
    <div class="grid gap-3 sm:grid-cols-2">
      <label class="flex flex-col gap-1 text-caption text-surface-300">
        {{ 'common.doctor' | transloco }}
        <p-select
          [ngModel]="doctorId()"
          (ngModelChange)="doctorId.set($event)"
          [options]="staff.activeDoctors()"
          optionLabel="nameLatin"
          optionValue="id"
          [showClear]="true"
          [placeholder]="'scheduler.allDoctors' | transloco"
          appendTo="body"
          styleClass="w-full"
        />
      </label>
      <label class="flex flex-col gap-1 text-caption text-surface-300">
        {{ 'common.chair' | transloco }}
        <p-select
          [ngModel]="chairId()"
          (ngModelChange)="chairId.set($event)"
          [options]="staff.activeChairs()"
          optionLabel="name"
          optionValue="id"
          [showClear]="true"
          [placeholder]="'scheduler.allChairs' | transloco"
          appendTo="body"
          styleClass="w-full"
        />
      </label>
    </div>
  </div>
  <ng-template #footer>
    <p-button
      type="button"
      [label]="'common.cancel' | transloco"
      severity="secondary"
      [outlined]="true"
      (onClick)="visible.set(false)"
    />
    <p-button
      type="button"
      [label]="'common.save' | transloco"
      icon="pi pi-check"
      [loading]="store.saving()"
      (onClick)="submit()"
    />
  </ng-template>
</p-dialog>
