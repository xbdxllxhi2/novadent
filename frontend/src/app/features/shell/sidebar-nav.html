<div class="flex h-[56px] flex-none items-center gap-2.5 border-b border-surface-700 px-4">
  <span
    class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary text-primary-contrast"
  >
    <svg viewBox="0 0 64 64" class="h-5 w-5" aria-hidden="true">
      <path
        d="M20 44 V22 l24 22 V22"
        fill="none"
        stroke="currentColor"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </span>
  <div class="min-w-0">
    <p class="truncate text-ui font-semibold leading-tight">Novadent</p>
    <p class="truncate text-meta text-surface-400">{{ settings.clinicName() }}</p>
  </div>
</div>

<nav class="flex flex-1 flex-col gap-0.5 overflow-y-auto p-2" aria-label="Main">
  @for (item of items(); track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="bg-surface-800 text-primary"
      [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
      (click)="navigated.emit()"
      class="flex items-center gap-3 rounded-lg px-3 py-2 text-ui text-surface-300 transition-colors hover:bg-surface-800 hover:text-surface-100"
    >
      <i class="pi text-ui-lg" [class]="'pi ' + item.icon"></i>
      <span class="truncate">{{ item.labelKey | transloco }}</span>
    </a>
  }
</nav>

<div class="flex-none border-t border-surface-700 px-4 py-3 text-meta text-surface-500">
  {{ 'common.appVersion' | transloco: { version: '0.1' } }}
</div>
