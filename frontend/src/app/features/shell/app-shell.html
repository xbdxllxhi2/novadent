<!-- Static sidebar on large screens -->
<aside
  class="hidden w-[232px] flex-none border-e border-surface-700 bg-surface-chrome lg:flex lg:flex-col"
>
  <app-sidebar-nav />
</aside>

<!-- Drawer on small screens -->
<p-drawer
  [visible]="drawerOpen()"
  (visibleChange)="drawerOpen.set($event)"
  [showCloseIcon]="false"
  styleClass="w-[260px] !bg-surface-chrome !p-0"
>
  <ng-template #content>
    <app-sidebar-nav (navigated)="drawerOpen.set(false)" />
  </ng-template>
</p-drawer>

<div class="flex min-w-0 flex-1 flex-col">
  <app-topbar (menuClick)="drawerOpen.set(true)" />
  <main class="min-h-0 flex-1 overflow-y-auto">
    <div class="mx-auto w-full max-w-[1400px] px-4 py-5 sm:px-6">
      <router-outlet />
    </div>
  </main>
</div>
