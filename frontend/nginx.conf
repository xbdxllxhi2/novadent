server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    # Repeated inside every location below: a location's own add_header (the
    # Cache-Control lines) would otherwise drop these inherited ones.
    include /etc/nginx/conf.d/security-headers.inc;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # SPA fallback. Deep links (/patients/<id>/chart), a refresh on any route, and later
    # the Keycloak redirect back to /?code=... must all be served index.html.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }

    # Runtime config, rewritten at container start. It is NOT content-hashed, so it must
    # never be cached: a stale copy would pin the browser to a previous backend mode or API
    # host. An exact-match location takes priority over the regex rule below.
    location = /config.js {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Translations are fetched at runtime by path and are not content-hashed either.
    location /i18n/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed bundles are content-addressed, so they can be cached forever.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|map)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the current bundle hashes.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
}
